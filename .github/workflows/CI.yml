name: CI

on:
  push:
    branches:
      - main
      - parallel 
  pull_request:
    branches:
      - main  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ make

    - name: Build project
      run: make
