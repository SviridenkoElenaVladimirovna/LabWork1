name: CI

on:
  push:
    branches:
      - main
      - parallel
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make libgtest-dev cmake

    - name: Build Google Test libraries
      run: |
        cd /usr/src/googletest/googletest
        sudo cmake .
        sudo make
        sudo cp lib/libgtest*.a /usr/lib/

    - name: Build Project
      run: make

  run_tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make libgtest-dev cmake

    - name: Build Google Test libraries
      run: |
        cd /usr/src/googletest/googletest
        sudo cmake .
        sudo make
        sudo cp lib/libgtest*.a /usr/lib/

    - name: Build Tests
      run: make test

    - name: Run Tests
      run: ./test-Labwork1
