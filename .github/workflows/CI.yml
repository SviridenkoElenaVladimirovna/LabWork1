name: CI

on:
  push:
    branches:
      - main
      - parallel
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y g++ make libgtest-dev cmake

    - name: Build Google Test library
      run: |
        cd /usr/src/gtest
        sudo cmake .
        sudo make
        sudo cp libgtest.a /usr/lib/
        sudo cp libgtest_main.a /usr/lib/

    - name: Build project
      run: make test

    - name: Run tests
      run: ./test-Labwork1
